version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: navuchai_app_dev
    restart: always
    env_file:
      - .env
    ports:
      - "8013:8012"  # внешний порт 8013, чтобы не конфликтовать с продом
    volumes:
      - .:/app  # автоперезагрузка при изменениях
    command: uvicorn app.main:app --host 0.0.0.0 --port 8012 --reload
