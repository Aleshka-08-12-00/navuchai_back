stages:
  - deploy

before_script:
  - 'which ssh-agent || ( apt-get update -y && apt-get install -y openssh-client )'
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - ssh-keyscan -H 172.16.0.97 >> ~/.ssh/known_hosts

deploy_dev:
  stage: deploy
  only:
    - develop
  script:
    - ssh geo@172.16.0.97 "
        cd /home/geo/navuchai_back/navuchai_api && \
        git pull origin develop && \
        docker-compose -p navuchai_dev -f docker-compose.dev.yml up -d --build
      "

deploy_prod:
  stage: deploy
  only:
    - main
  script:
    - ssh geo@172.16.0.97 "
        cd /home/geo/navuchai_back/navuchai_api && \
        git pull origin main && \
        docker-compose -p navuchai_prod -f docker-compose.prod.yml up -d --build
      "