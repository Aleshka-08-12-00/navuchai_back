stages:
  - deploy

before_script:
  - which ssh-agent || ( apt-get update -y && apt-get install -y openssh-client )
  - eval $(ssh-agent -s)
  - mkdir -p ~/.ssh
  - cat "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  - ssh-add ~/.ssh/id_rsa



deploy_dev:
  stage: deploy
  only:
    - develop
  script:
    - ssh geo@172.16.0.97 "
        cd /home/geo/navuchai_back/navuchai_api && \
        git pull origin develop && \
        docker-compose -p navuchai_dev -f docker-compose.dev.yml up -d --build
      "

deploy_prod:
  stage: deploy
  only:
    - main
  script:
    - ssh geo@172.16.0.97 "
        cd /home/geo/navuchai_back/navuchai_api && \
        git pull origin main && \
        docker-compose -p navuchai_prod -f docker-compose.prod.yml up -d --build
      "
